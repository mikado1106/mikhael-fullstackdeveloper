services:
  postgres:
    image: postgres:16-alpine
    container_name: lokerkita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lokerkita
      POSTGRES_PASSWORD: lokerkita
      POSTGRES_DB: lokerkita
    ports:
      - "5432:5432"
    volumes:
      - lokerkita_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokerkita -d lokerkita"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lokerkita_postgres_data:
